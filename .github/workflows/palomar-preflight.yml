# Palomar's mechanical preflight: runs Palomar's own check tool, at one fixed version, on this repository.
# Started by hand only. The call block is Palomar's own example (PalomarRegistry/PalomarSubmission README), with our two paths.
name: palomar-preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"lean","comparator_config_path":"lean/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
