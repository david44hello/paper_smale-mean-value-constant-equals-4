# Lean 4 proof that Smale's mean value constant (1981) equals 4.
name = "SmaleLean"
version = "0.1.0"
defaultTargets = ["Smale"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Smale"
globs = ["Smale"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
