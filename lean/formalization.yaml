    location: "Zenodo (all versions); also Hexagon, https://hexagonmath.org/2611.00282"
    relationship: "formalizes"
    note: "Theorem 1.1 of version 2.70, K* = lim K(d) = 4, is the formalized statement."
    license: "All rights reserved (Zenodo record); CC BY-SA 4.0 (Hexagon copy)"
    author_endorsement: "participated"
  - title: "The fundamental theorem of algebra and complexity theory"
    authors:
      - "S. Smale"
    id: "Bull. Amer. Math. Soc. (N.S.) 4 (1981), 1-36"
    type: "paper"
    relationship: "background"
    note: "States the mean value problem and proves the bound 4 (K* <= 4); asks whether 4 can be replaced by 1."
  - title: "Mathematical problems for the next century"
    authors:
