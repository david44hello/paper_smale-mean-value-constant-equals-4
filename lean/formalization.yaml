    id: "https://doi.org/10.5281/zenodo.24096098"
    type: "paper"
    relationship: "background"
    note: "The previous lower bound, K* > 1.1559."

related_formalizations:
  - id: "https://github.com/tadamcz/mean-value-problem"
    relationship: "independent"
    note: "Lean disproof of Smale's conjecture K* = 1. This project proves the stronger fact K* = 4 and does not use it."

status:
  scope: >-
    Compared by `lake comparator` (see alignment): Theorem 1.1 of the paper
    (K* = lim K(d) = 4), stated in the paper's own normalization (p'(0) != 0)
    and in the normalization p'(0) = 1. Also proved in the library, not among
    the compared statements, each for d >= 2: both normalizations give the same
    K(d); Smale's bound K(d) <= 4; the bound K(d) <= 4(d-1)/(d+1), listed under
    Conte, Fujikawa and Lakic in the table of Adamczewski and Colbrook (their
    Section 2.2); K(d) < 4; K(d) does not decrease with d. Not in this
    entry: the paper's other numbered results (Theorem 1.2, Proposition 2.1,
    Lemmas 2.2, 2.3 and 3.1, Propositions 3.2 and 4.1, Remarks 6.1-6.3) and the
    estimates of Beardon-Minda-Ng and of Crane. The proof uses its own disc
    form of the Jatar-Ng reduction instead of the paper's Proposition 2.1,
    whose analytic-Jordan-domain form needs a part of the Jordan curve theorem
    that Mathlib does not have, and Fekete points instead of the paper's
    Lemma 2.2. Gaps and limits. The proof is not effective: for a given a < 4
    it gives no bound on the least degree d with K(d) > a.
  # Counted over the proof development; Challenge.lean's three open proofs are excluded, as Palomar asks.
  sorry_count: 0
  sorry_in_definitions: 0
  # Every axiom the compared theorems use, as `#print axioms` prints them (the standard three).
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      tool_setup: "AI agents, steered by the author in a continuous critical dialogue"
  notes: "The paper's AI Disclosure: This work was done overwhelmingly by AI models, steered by the author in a continuous critical dialogue, alternating between Anthropic's Claude and OpenAI's ChatGPT. The author takes full responsibility for the paper."

fidelity:
  divergences: >-
    Known divergences from the paper. (1) K(d) and K* are suprema taken in the
    extended real numbers (EReal), where every supremum exists; the theorems
    say that K* equals the real number 4 and that K(d) tends to it. (2) S(p) is defined as an infimum
    over the critical points; for the normalization p'(0) = 1 and d >= 2 the
    library proves that it is attained (sec1_m_attained_proved). (3) K(d) is
    defined for every natural number d; for d < 2, outside the paper's range,
    its value is a convention of Lean's; K* is the supremum over d >= 2 only,
    and the limit as d tends to infinity does not depend on those values.
    (4) The route of the proof differs from the paper's in two places: its own
    disc form of the Jatar-Ng reduction (Smale/P030/Bridge.lean) in place of
    Proposition 2.1, and Fekete points (Smale/Proofs/JNFekete.lean) in place of
    Lemma 2.2. Theorem 1.1 is stated as printed, with no added hypothesis.

review:
  status: "agent-reviewed, author-verified"
  reviewers:
    - "OpenAI Codex, which wrote none of the files"
  notes: "Method: build from an empty folder; axiom check (the three standard axioms only); kernel replay of 23 modules; Lean proof checkers on an exported copy; lake comparator as Palomar runs it. OpenAI Codex read the log of each run and compared the Lean statement of Theorem 1.1 and the ten definitions with the paper. The human author checked this formalization and stands by it."

alignment:
  namespace: "Smale"
  statements:
    - source: "Theorem 1.1 of the paper (version 2.70), in the paper's normalization p'(0) != 0"
      lean: "Smale.P030.Rows.thm_1_1"
      module: "Smale.P030.Rows.Thm11"
      status: "proved"
      note: "Proved in Smale/P030/Rows/Thm11.lean from kstar_eq_four and tendsto_Kd_four, with KdGen_eq_Kd (both normalizations give the same K(d))."
    - source: "Theorem 1.1 of the paper, the value K* = 4, for p'(0) = 1"
      lean: "Smale.P030.kstar_eq_four"
      module: "Smale.P030.Contract"
      status: "proved"
      note: "Proved in Smale/P030/Contract.lean."
    - source: "Theorem 1.1 of the paper, the limit K(d) -> 4, for p'(0) = 1"
      lean: "Smale.P030.tendsto_Kd_four"
      module: "Smale.P030.Contract"
      status: "proved"
      note: "Proved in Smale/P030/Contract.lean."

acknowledgements: "Lean 4 and Mathlib, both at v4.35.0."
