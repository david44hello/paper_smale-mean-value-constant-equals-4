# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar registry: Lean 4 proof of Theorem 1.1 of "Smale's mean value constant (1981)
# equals 4".
version: "v0.4"

project:
  name: "Smale's mean value constant equals 4"
  description: >-
    A Lean 4 proof that Smale's mean value constant equals 4. For a complex
    polynomial p of degree d >= 2 with p(0) = 0 and p'(0) != 0, let S(p) be the
    minimum of |p(c)/(c p'(0))| over the critical points c of p, let K(d) be the
    supremum of S(p) over all such p of degree d, and let K* be the supremum of
    K(d) over d >= 2. In 1981 Smale proved K* <= 4 and asked whether 4 can be
    replaced by 1 (and asked it again in 2000). The formalization proves
    K* = lim_{d -> oo} K(d) = 4, which is
    Theorem 1.1 of D. Goel, "Smale's mean value constant (1981) equals 4". It
    also proves Smale's bound K(d) <= 4, that K(d) does not decrease with d, and
    that K(d) < 4 for every d.

    Comparison with Smale's conjecture. Smale asked whether K* = 1. That was
    disproved in 2026 (Adamczewski's Lean disproof; Adamczewski and Colbrook).
    Jatar and Ng then proved K* > 1.1018, and the author proved K* > 1.1559.
    This project does not prove the conjecture: it answers Smale's question in
    the negative. K* equals 4, Smale's own bound, so no constant smaller than 4
    works for all degrees. In each single degree the constant stays below 4:
    K(d) <= 4^((d-2)/(d-1)) (Beardon, Minda and Ng, 2002), and
    K(d) < 4 - 2.263/sqrt(d) for d >= 8 (Crane, 2007). So the supremum K* is not
    attained.
  authors:
    - "Dave Goel"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dave Goel"

classification:
